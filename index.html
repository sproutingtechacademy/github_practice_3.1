<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobPortal</title>
    <link rel="stylesheet" href="style.css" />
    <!-- เพิ่ม FontAwesome สำหรับไอคอนใน Navbar และฟอร์ม -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav>
      <div class="logo">
        <i class="fas fa-briefcase"></i> JobPortal
      </div>
      <ul>
        <li><a href="#">หน้าแรก</a></li>
        <li><a href="#">ตำแหน่งงาน</a></li>
        <li><a href="#">เกี่ยวกับเรา</a></li>
        <li><a href="#">ติดต่อ</a></li>
      </ul>
      <button class="btn-login">เข้าสู่ระบบ</button>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
      <div class="hero-content">
        <div class="hero-text">
          <h1>
            ร่วมเป็นส่วนหนึ่ง<br />
            <span>กับทีมงานของเรา</span>
          </h1>
          <p>
            ค้นหาโอกาสในการทำงานที่ตรงกับความสามารถของคุณ<br />
            พร้อมเติบโตไปด้วยกันกับองค์กรชั้นนำ
          </p>
        </div>
        <div class="hero-image">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfYlmKqnlDKGY-iVXFEP2iuq2f4_beQasrTygMWaoCbw&s=10?" alt="Hero Image" />
        </div>
      </div>
    </header>

    <!-- Application Form -->
    <main>
      <section class="application-container">
        <h2>แบบฟอร์มสมัครงาน</h2>
        <p>กรุณากรอกข้อมูลให้ครบถ้วนเพื่อดำเนินการสมัครงาน</p>
        
      </section>
    </main>
    
  </body> 
</html>
